services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - QLANKR_GRAPHS_ROOT=/data/graphs
      - QLANKR_CLONES_ROOT=/data/clones
      # Legacy / fallback — moves to per-user storage during Phase 3 wiring.
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - LANGSMITH_API_KEY=${LANGSMITH_API_KEY}
      - LANGSMITH_TRACING=true
      - LANGSMITH_ENDPOINT=${LANGSMITH_ENDPOINT}
      - LANGSMITH_PROJECT=${LANGSMITH_PROJECT:-qlankr}
      - LANGCHAIN_TRACING_V2=true
      - LANGCHAIN_API_KEY=${LANGSMITH_API_KEY}
      - LANGCHAIN_ENDPOINT=${LANGSMITH_ENDPOINT}
      - LANGCHAIN_PROJECT=${LANGSMITH_PROJECT:-qlankr}
    volumes:
      - ./backend:/app          # live-reload Python changes without rebuild
      - qlankr_graphs:/data/graphs   # per-user KuzuDB graphs persist across `docker compose down`
      - qlankr_clones:/data/clones   # per-user repo clones persist across container restarts
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "5173:5173"
    env_file:
      - .env
    environment:
      - VITE_API_URL=${VITE_API_URL:-http://localhost:8000}
      - VITE_SUPABASE_URL=${VITE_SUPABASE_URL}
      - VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY}
    volumes:
      - ./frontend:/app/frontend          # live HMR for TS/TSX changes
      - /app/frontend/node_modules        # keep container's node_modules
    depends_on:
      - backend

  backend-test:
    build: ./backend
    profiles: [test]
    command: python3 -m pytest --tb=short -q
    env_file:
      - .env
    environment:
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - GITHUB_TOKEN=${GITHUB_TOKEN}

  frontend-test:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    profiles: [test]
    command: sh -c "cd frontend && npm test"

volumes:
  qlankr_graphs:
  qlankr_clones:
